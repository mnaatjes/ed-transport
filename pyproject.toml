[project]
name = "ed-transport"
version = "0.1.0"
description = "Resilient Hexagonal HTTP transport and telemetry delivery engine for Elite Dangerous"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
# Boundary Linters & Architectural Compliance
"import-linter>=2.1",
"pytest-archon>=0.0.6",
# Quality Gates & Testing
"pytest>=8.0.0",
"pytest-cov>=5.0.0",
"ruff>=0.7.3",
"mypy>=1.13.0",
"pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
